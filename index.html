<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1530" />
    <meta name="apple-mobile-web-app-title" content="台灣大亂鬥" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>台灣大亂鬥 Taiwan Brawl</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        outline: none;
      }
      body.touch-mode {
        touch-action: none;
      }

      /* ---------- 觸控介面（荒野亂鬥式：直接疊在遊戲畫面上） ---------- */
      .touch-ui {
        --k: 1;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .touch-zone,
      .touch-btn,
      .touch-top {
        pointer-events: auto;
        touch-action: none;
      }
      /* 浮動搖桿的感應區：左半邊、HUD 以下 */
      .touch-zone {
        position: absolute;
        left: 0;
        top: 22%;
        width: 50%;
        bottom: 0;
      }
      .touch-stick {
        position: absolute;
        width: 124px;
        height: 124px;
        margin: -62px 0 0 -62px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.18));
        border: 3px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
        transform: scale(var(--k));
      }
      /* 沒按時在預設位置顯示半透明提示 */
      .touch-stick.idle {
        left: max(110px, calc(env(safe-area-inset-left) + 90px));
        top: calc(100% - 100px);
        opacity: 0.35;
      }
      .touch-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        transform: translate(-50%, -50%);
      }
      .touch-pad {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 250px;
        height: 210px;
        transform: scale(var(--k));
        transform-origin: bottom right;
        opacity: 0.9;
      }
      /* 選單畫面：按鈕更透明，避免擋住角色卡 */
      body:not(.in-battle) .touch-pad {
        opacity: 0.55;
      }
      body:not(.in-battle) .touch-stick.idle {
        opacity: 0.18;
      }
      .touch-btn {
        position: absolute;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 900;
        font-size: 15px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        border: 3px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45);
        transition: transform 0.05s;
      }
      .touch-btn.down {
        transform: scale(0.9);
        filter: brightness(1.4);
      }
      .btn-a {
        right: 0;
        bottom: 0;
        width: 98px;
        height: 98px;
        font-size: 19px;
        background: rgba(239, 68, 68, 0.62);
      }
      .btn-j {
        right: 112px;
        bottom: 6px;
        width: 64px;
        height: 64px;
        background: rgba(59, 130, 246, 0.6);
      }
      .btn-d {
        right: 8px;
        bottom: 114px;
        width: 62px;
        height: 62px;
        background: rgba(34, 197, 94, 0.6);
      }
      /* 必殺鈕：外圈依 MP 充能（荒野亂鬥的大招鈕） */
      .btn-sa,
      .btn-sj {
        --charge: 100%;
        background: conic-gradient(#facc15 var(--charge), rgba(80, 60, 0, 0.55) 0);
        border-color: rgba(255, 255, 255, 0.5);
      }
      .btn-sa span,
      .btn-sj span {
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: rgba(161, 98, 7, 0.85);
      }
      .btn-sa.ready span {
        background: rgba(234, 179, 8, 0.95);
        color: #3b2a00;
        text-shadow: none;
      }
      .btn-sj.ready span {
        background: rgba(147, 51, 234, 0.9);
      }
      .btn-sa {
        right: 92px;
        bottom: 88px;
        width: 76px;
        height: 76px;
        font-size: 17px;
      }
      .btn-sj {
        right: 182px;
        bottom: 78px;
        width: 58px;
        height: 58px;
        font-size: 12px;
      }
      .touch-top {
        position: absolute;
        top: max(6px, env(safe-area-inset-top));
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.45);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      .touch-pause {
        right: max(8px, env(safe-area-inset-right));
      }
      .touch-full {
        right: calc(max(8px, env(safe-area-inset-right)) + 46px);
      }
      /* 直向：提示轉成橫向 */
      .touch-rotate {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: auto;
        background: rgba(5, 8, 20, 0.92);
        color: #fff;
        font-size: 20px;
        font-weight: bold;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
      }
      .touch-rotate small {
        font-size: 13px;
        font-weight: normal;
        opacity: 0.75;
      }
      .rotate-icon {
        font-size: 56px;
        animation: tilt 1.6s ease-in-out infinite;
      }
      @keyframes tilt {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) {
        .touch-rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="450" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
