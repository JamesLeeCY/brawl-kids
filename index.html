<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>混戰小英雄 Brawl Kids</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        outline: none;
      }
      body.touch-mode {
        touch-action: none;
      }
      /* 直向手機：遊戲畫面放上方，操作區在下方 */
      @media (orientation: portrait) {
        body.touch-mode {
          align-items: flex-start;
          padding-top: max(8px, env(safe-area-inset-top));
          box-sizing: border-box;
        }
      }

      /* ---------- 觸控介面 ---------- */
      .touch-ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
      }
      .touch-stick,
      .touch-btn,
      .touch-top {
        pointer-events: auto;
        touch-action: none;
        position: absolute;
      }
      .touch-stick {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: min(36vmin, 170px);
        height: min(36vmin, 170px);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .touch-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44%;
        height: 44%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
        transform: translate(-50%, -50%);
      }
      .touch-pad {
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        width: min(46vmin, 220px);
        height: min(40vmin, 190px);
      }
      .touch-btn {
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: bold;
        font-size: min(3.6vmin, 16px);
        text-shadow: 0 1px 2px #000;
        border: 2px solid rgba(255, 255, 255, 0.5);
        width: 30%;
        aspect-ratio: 1;
      }
      .touch-btn.down {
        filter: brightness(1.6);
        transform: scale(0.94);
      }
      .btn-a {
        right: 0;
        bottom: 0;
        width: 36%;
        background: rgba(239, 68, 68, 0.55);
      }
      .btn-j {
        right: 38%;
        bottom: 0;
        background: rgba(59, 130, 246, 0.55);
      }
      .btn-d {
        right: 4%;
        bottom: 44%;
        background: rgba(34, 197, 94, 0.55);
      }
      .btn-sa {
        right: 40%;
        bottom: 40%;
        background: rgba(234, 179, 8, 0.6);
      }
      .btn-sj {
        right: 70%;
        bottom: 12%;
        width: 27%;
        background: rgba(168, 85, 247, 0.55);
        font-size: min(3vmin, 13px);
      }
      .touch-top {
        top: max(8px, env(safe-area-inset-top));
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .touch-rotate {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 45%;
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
        font-size: 14px;
      }
      @media (orientation: portrait) {
        .touch-rotate {
          display: block;
        }
      }
      .touch-pause {
        right: max(8px, env(safe-area-inset-right));
      }
      .touch-full {
        right: calc(max(8px, env(safe-area-inset-right)) + 48px);
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="450" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
